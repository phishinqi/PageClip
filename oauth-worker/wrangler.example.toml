# Copy to wrangler.toml and fill every placeholder; never commit secrets.
name = "pageclip-oauth"
main = "src/worker.js"
compatibility_date = "2026-01-01"
workers_dev = false
preview_urls = false
# Use a dedicated publisher HTTPS hostname. Add a custom-domain route after ownership validation.
# routes = [{ pattern = "oauth.your-publisher-domain.tld", custom_domain = true }]

[vars]
# Intentionally blank: deployment must fail closed until publisher supplies real values.
PUBLIC_ORIGIN = ""
GOOGLE_CLIENT_ID = ""
ALLOWED_EXTENSION_ORIGINS = '[]'
TOKEN_ENCRYPTION_KEY_ID = "k1"

[[d1_databases]]
binding = "DB"
database_name = "pageclip-oauth"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = false

# Optional additional Cloudflare rate-limiter binding. D1 limits remain mandatory.
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
# simple = { limit = 120, period = 60 }

# REQUIRED secrets (wrangler secret put NAME):
# GOOGLE_CLIENT_SECRET              Publisher Google OAuth WEB client secret
# TOKEN_ENCRYPTION_KEY              Base64-encoded cryptorandom 32 bytes
# RATE_LIMIT_SALT                   Independent cryptorandom >=32-character secret
# OPTIONAL secret:
# TOKEN_ENCRYPTION_PREVIOUS_KEYS    JSON object of old key IDs to base64 32-byte keys
