<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>PageClip - 本地预览</title>
  <style>
    html, body { height: 100%; margin: 0; background: #3a3f47; }
    .wrap {
      height: 100%;
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 0;
    }
    /* 模拟 Chrome 侧边栏宽度（可拖窄看响应式） */
    .panel {
      width: 380px;
      min-width: 300px;
      resize: horizontal;
      overflow: hidden;
      border-radius: 10px 0 0 10px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.45);
      background: #fff;
    }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel"><iframe src="../sidepanel.html"></iframe></div>
  </div>
</body>
</html>
